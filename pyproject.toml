
[project]
name = "agent-workflow-harness"
version = "0.0.0"
description = "A deterministic YAML workflow control plane for coding agents."
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
awh = "agent_workflow_harness.cli:main"

[tool.setuptools.packages.find]
include = ["agent_workflow_harness*"]

[tool.setuptools.package-data]
agent_workflow_harness = [
  "workflows/*/workflow.yaml",
  "workflows/*/references/*",
  "workflows/*/scripts/*",
  "workflows/*/resources/*",
  "workflows/*/assets/*",
  "workflows/*/templates/*",
]
